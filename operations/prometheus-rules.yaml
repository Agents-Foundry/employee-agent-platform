# Generated by `npm run ops:render` from packages/operations (ADR 0039). Do not edit:
# change alert-thresholds.json for the deployment and render again.
groups:
  - name: agents-foundry-pilot
    rules:
      - alert: AfRunsFailing
        expr: "sum (increase(af_runs_finished_total{status=\"FAILED\"}[1h])) > 5"
        for: 5m
        labels:
          severity: warning
          af_alert: runs-failing
        annotations:
          summary: "Runs are failing"
          description: "More runs failed in the last hour than expected. The reason label says why."
          runbook: "docs/pilot-runbook.md#reading-the-dashboards"
      - alert: AfCompletionRateLow
        expr: "(sum (increase(af_runs_finished_total{status=\"COMPLETED\"}[6h]))) / (sum (increase(af_runs_finished_total[6h]))) < 0.8"
        for: 30m
        labels:
          severity: warning
          af_alert: completion-rate-low
        annotations:
          summary: "Completion rate is low"
          description: "Fewer than the expected share of runs completed in six hours."
          runbook: "docs/pilot-runbook.md#reading-the-dashboards"
      - alert: AfQueueBacklog
        expr: "sum (af_runs{status=\"QUEUED\"}) > 20"
        for: 15m
        labels:
          severity: warning
          af_alert: queue-backlog
        annotations:
          summary: "Runs are queuing"
          description: "Runs are waiting for a runtime. Check that agent runtimes are running."
          runbook: "docs/pilot-runbook.md#starting-and-stopping-runtimes"
      - alert: AfLeaseExpired
        expr: "sum (af_runtime_leases{state=\"expired\"}) > 0"
        for: 15m
        labels:
          severity: critical
          af_alert: lease-expired
        annotations:
          summary: "A runtime is gone and its runs wait"
          description: "Run leases expired and nothing picked the runs up."
          runbook: "docs/pilot-runbook.md#recovering-a-stuck-run"
      - alert: AfRecoveryRateLow
        expr: "(sum (increase(af_run_recoveries_total[6h]))) / (sum (increase(af_runtime_leases_expired_total[6h]))) < 0.9"
        for: 30m
        labels:
          severity: warning
          af_alert: recovery-rate-low
        annotations:
          summary: "Expired runs are not being recovered"
          description: "Fewer runs were handed to another runtime than leases expired."
          runbook: "docs/pilot-runbook.md#recovering-a-stuck-run"
      - alert: AfRunsAbandoned
        expr: "sum (increase(af_runs_abandoned_total[1h])) > 0"
        for: 0m
        labels:
          severity: warning
          af_alert: runs-abandoned
        annotations:
          summary: "Runs were abandoned"
          description: "Runs were cancelled because nothing could continue them."
          runbook: "docs/pilot-runbook.md#recovering-a-stuck-run"
      - alert: AfReconciliationRequired
        expr: "sum (af_action_reconciliations_open) > 0"
        for: 0m
        labels:
          severity: critical
          af_alert: reconciliation-required
        annotations:
          summary: "A write needs reconciling"
          description: "A governed write has an unknown outcome. An administrator must check the external system and resolve it."
          runbook: "docs/pilot-runbook.md#handling-writes-to-reconcile"
      - alert: AfApprovalWaitHigh
        expr: "histogram_quantile(0.95, sum by (le) (rate(af_approval_wait_ms_bucket[6h]))) > 1800000"
        for: 30m
        labels:
          severity: info
          af_alert: approval-wait-high
        annotations:
          summary: "Approvals are waiting long"
          description: "Approvals take longer than expected; runs are paused meanwhile."
          runbook: "docs/pilot-runbook.md#reading-the-dashboards"
      - alert: AfModelLatencyHigh
        expr: "histogram_quantile(0.95, sum by (le) (rate(af_model_latency_ms_bucket[15m]))) > 60000"
        for: 15m
        labels:
          severity: warning
          af_alert: model-latency-high
        annotations:
          summary: "Model calls are slow"
          description: "The model provider is slow to answer."
          runbook: "docs/pilot-runbook.md#reading-the-dashboards"
      - alert: AfModelFailures
        expr: "sum (increase(af_model_calls_total{result!=\"succeeded\"}[15m])) > 5"
        for: 5m
        labels:
          severity: warning
          af_alert: model-failures
        annotations:
          summary: "Model calls are failing"
          description: "Model calls did not succeed. Check the provider and the model credential."
          runbook: "docs/pilot-runbook.md#rotating-credentials"
      - alert: AfModelBudgetDenials
        expr: "sum (increase(af_model_budget_decisions_total{decision=\"denied\"}[1h])) > 0"
        for: 0m
        labels:
          severity: warning
          af_alert: model-budget-denials
        annotations:
          summary: "A model spending limit is being hit"
          description: "Model calls were refused by a spending limit; those runs failed."
          runbook: "docs/pilot-runbook.md#reading-the-dashboards"
      - alert: AfModelCostBurn
        expr: "sum (increase(af_model_cost_micros_total[1h])) > 50000000"
        for: 0m
        labels:
          severity: info
          af_alert: model-cost-burn
        annotations:
          summary: "Model spending is high"
          description: "More was spent on models in the last hour than expected (in micros)."
          runbook: "docs/pilot-runbook.md#reading-the-dashboards"
      - alert: AfConnectorFailures
        expr: "sum (increase(af_connector_errors_total[15m])) > 3"
        for: 5m
        labels:
          severity: warning
          af_alert: connector-failures
        annotations:
          summary: "Connector calls are failing"
          description: "Calls to Jira or GitHub failed. Check the connection and its credential."
          runbook: "docs/pilot-runbook.md#rotating-credentials"
      - alert: AfSecretStoreUnavailable
        expr: "sum (increase(af_secret_resolutions_total{result=\"provider_unavailable\"}[10m])) > 0"
        for: 0m
        labels:
          severity: critical
          af_alert: secret-store-unavailable
        annotations:
          summary: "The secret store is unreachable"
          description: "Vault did not answer. Actions and model calls that need a secret are refused."
          runbook: "docs/pilot-runbook.md#responding-to-vault-failures"
      - alert: AfSecretMissing
        expr: "sum (increase(af_secret_resolutions_total{result=~\"not_found|invalid_reference\"}[1h])) > 0"
        for: 0m
        labels:
          severity: warning
          af_alert: secret-missing
        annotations:
          summary: "A secret is missing"
          description: "A secret reference names nothing in the secret store."
          runbook: "docs/pilot-runbook.md#responding-to-vault-failures"
      - alert: AfObjectStoreFailures
        expr: "sum (increase(af_object_store_failures_total[10m])) > 0"
        for: 5m
        labels:
          severity: critical
          af_alert: object-store-failures
        annotations:
          summary: "The artifact store is failing"
          description: "Uploads or downloads of evidence are failing."
          runbook: "docs/pilot-runbook.md#responding-to-artifact-failures"
      - alert: AfArtifactIntegrity
        expr: "sum (increase(af_artifact_integrity_failures_total[1h])) > 0"
        for: 0m
        labels:
          severity: critical
          af_alert: artifact-integrity
        annotations:
          summary: "Stored evidence does not match its record"
          description: "An artifact’s bytes did not match their hash. Treat as an incident."
          runbook: "docs/pilot-runbook.md#responding-to-artifact-failures"
      - alert: AfCredentialLeaseFailures
        expr: "sum (increase(af_credential_leases_total{event=~\"refused|unavailable\"}[15m])) > 0"
        for: 0m
        labels:
          severity: warning
          af_alert: credential-lease-failures
        annotations:
          summary: "Repository credentials are refused"
          description: "Credential leases for private checkouts are refused or unavailable."
          runbook: "docs/pilot-runbook.md#rotating-credentials"
      - alert: AfEgressUnavailable
        expr: "sum (increase(af_egress_failures_total[15m])) > 0"
        for: 0m
        labels:
          severity: critical
          af_alert: egress-unavailable
        annotations:
          summary: "Egress control is unavailable"
          description: "Sandboxes are refused because the egress proxy could not start."
          runbook: "docs/pilot-runbook.md#starting-and-stopping-runtimes"
      - alert: AfEgressDenialsHigh
        expr: "sum (increase(af_egress_denials_total[1h])) > 50"
        for: 0m
        labels:
          severity: info
          af_alert: egress-denials-high
        annotations:
          summary: "Sandboxes reach for hosts they may not"
          description: "Many connections from sandboxes were refused. Check the allowed hosts."
          runbook: "docs/pilot-runbook.md#reading-the-dashboards"
      - alert: AfSandboxStartupSlow
        expr: "histogram_quantile(0.95, sum by (le) (rate(af_sandbox_startup_ms_bucket[30m]))) > 60000"
        for: 15m
        labels:
          severity: warning
          af_alert: sandbox-startup-slow
        annotations:
          summary: "Sandboxes start slowly"
          description: "Preparing a sandbox takes longer than expected. Check the images and the host."
          runbook: "docs/pilot-runbook.md#starting-and-stopping-runtimes"
      - alert: AfCheckpointConflicts
        expr: "sum (increase(af_checkpoint_writes_total{result!=\"saved\"}[15m])) > 0"
        for: 0m
        labels:
          severity: warning
          af_alert: checkpoint-conflicts
        annotations:
          summary: "Checkpoint saves are refused"
          description: "Two runtimes on one run, or a stale checkpoint version."
          runbook: "docs/pilot-runbook.md#recovering-a-stuck-run"
      - alert: AfCheckpointCorrupt
        expr: "sum (increase(af_checkpoint_reads_total{result!~\"loaded|missing\"}[15m])) > 0"
        for: 0m
        labels:
          severity: critical
          af_alert: checkpoint-corrupt
        annotations:
          summary: "A checkpoint failed verification"
          description: "A stored checkpoint was altered or unreadable; its run fails closed."
          runbook: "docs/pilot-runbook.md#responding-to-database-failures"
      - alert: AfDatabaseConnections
        expr: "sum (increase(af_database_retries_total{reason=\"connection\"}[10m])) > 10"
        for: 5m
        labels:
          severity: warning
          af_alert: database-connections
        annotations:
          summary: "The database is dropping connections"
          description: "Transactions are being run again after lost connections."
          runbook: "docs/pilot-runbook.md#responding-to-database-failures"
      - alert: AfTelemetryDropped
        expr: "sum (increase(af_telemetry_dropped_total[15m])) > 0"
        for: 10m
        labels:
          severity: warning
          af_alert: telemetry-dropped
        annotations:
          summary: "Telemetry is being lost"
          description: "The collector is unreachable, or a caller tried to send content."
          runbook: "docs/pilot-runbook.md#reading-the-dashboards"
